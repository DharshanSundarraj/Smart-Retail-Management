spring.application.name=smart-retail-management

# ----------------------------------------
# SERVER CONFIGURATION
# ----------------------------------------
server.port=${PORT:8080}

# ----------------------------------------
# DATABASE CONNECTION (MySQL)
# ----------------------------------------
# Added allowPublicKeyRetrieval=true to bypass MySQL 8 SHA2 connection blocks
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:zetlan_db}?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USER:zetlan_user}
spring.datasource.password=${DB_PASSWORD:zetlan$1324}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ----------------------------------------
# HIBERNATE / JPA CONFIGURATION
# ----------------------------------------
spring.jpa.hibernate.ddl-auto=${DB_DDL_AUTO:update}
spring.jpa.show-sql=${SHOW_SQL:true}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

# ----------------------------------------
# REDIS CACHING CONFIGURATION
# ----------------------------------------
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}

# ----------------------------------------
# JWT SECURITY CONFIGURATION
# ----------------------------------------
jwt.secret=${JWT_SECRET:smart_retail_local_development_secret_key_must_be_long_enough}
jwt.expiration=${JWT_EXPIRATION_MS:86400000}

# ----------------------------------------
# WEB / SECURITY BYPASS FIX
# ----------------------------------------
spring.web.resources.static-locations=classpath:/static/,classpath:/public/,classpath:/resources/,classpath:/META-INF/resources/

logging.level.org.springframework.web=DEBUG
logging.level.com.zetlan.smartretailmanagement=DEBUG