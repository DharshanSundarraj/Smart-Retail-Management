spring.application.name=smart-retail-management
# ----------------------------------------
# SERVER CONFIGURATION
# ----------------------------------------
server.port=8080

# ----------------------------------------
# DATABASE CONNECTION (MySQL)
# ----------------------------------------
spring.datasource.url=jdbc:mysql://localhost:3306/smart_retail_db?useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=admin2026
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ----------------------------------------
# HIBERNATE / JPA CONFIGURATION
# ----------------------------------------
# 'update' automatically creates/updates database tables based on your Java code
spring.jpa.hibernate.ddl-auto=update
# Shows SQL queries in the console for debugging
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

spring.security.user.name=admin
spring.security.user.password=admin123