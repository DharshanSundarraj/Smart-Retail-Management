<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZetLan Portal - Authentication</title>
    <link rel="stylesheet" href="css/admin-styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap">
</head>
<body class="auth-body">

<div class="auth-wrapper">
    <div class="auth-card">

        <div class="auth-header">
            <i class="fa-solid fa-store brand-icon-large"></i>
            <h1><span class="zetlan-highlight">ZetLan</span> Portal</h1>
        </div>

        <!-- ================= LOGIN FORM ================= -->
        <form id="login-form" class="auth-form">
            <div class="form-group">
                <label for="login-email">Email Address</label>
                <input type="email" id="login-email" class="form-control" placeholder="Enter your email" required>
            </div>

            <div class="form-group">
                <label for="login-password">Password</label>
                <div class="input-with-icon">
                    <input type="password" id="login-password" class="form-control" placeholder="••••••••••••" required>
                    <i class="fa-solid fa-eye-slash toggle-password" onclick="togglePasswordVisibility('login-password', this)"></i>
                </div>
            </div>

            <a class="forgot-link" onclick="switchAuthView('forgot')">Forgot Password?</a>

            <button type="submit" class="btn btn-primary auth-btn">
                <i class="fa-solid fa-arrow-right-to-bracket btn-icon-left"></i> Sign In
            </button>

            <div class="auth-toggle">
                <span>New to ZetLan?</span>
                <a onclick="switchAuthView('register')">Create an account</a>
            </div>
        </form>

        <!-- ================= REGISTER FORM ================= -->
        <form id="register-form" class="auth-form auth-hidden">
            <div class="form-group">
                <label for="reg-name">Full Name</label>
                <input type="text" id="reg-name" class="form-control" placeholder="Enter full name" required>
            </div>

            <div class="form-group">
                <label for="reg-email">Email Address</label>
                <input type="email" id="reg-email" class="form-control" placeholder="Enter email address" required>
            </div>

            <div class="form-group">
                <label>Role</label>
                <div class="custom-dropdown" id="reg-role-dropdown">
                    <div class="dropdown-selected" id="reg-role-selected">Select a role</div>
                    <div class="dropdown-options" id="reg-role-options">
                        <div class="dropdown-option" data-value="1">ADMIN</div>
                        <div class="dropdown-option" data-value="2">MANAGER</div>
                        <div class="dropdown-option" data-value="3">STAFF</div>
                    </div>
                    <input type="hidden" id="reg-role" required>
                </div>
            </div>

            <div class="form-group">
                <label for="reg-password">Password</label>
                <div class="input-with-icon">
                    <input type="password" id="reg-password" class="form-control" placeholder="••••••••••••" required>
                    <i class="fa-solid fa-eye-slash toggle-password" onclick="togglePasswordVisibility('reg-password', this)"></i>
                </div>
            </div>

            <button type="submit" class="btn btn-primary auth-btn">
                <i class="fa-solid fa-user-plus btn-icon-left"></i> Register User
            </button>

            <div class="auth-toggle">
                <span>Already registered?</span>
                <a onclick="switchAuthView('login')">Sign in here</a>
            </div>
        </form>

        <!-- ================= FORGOT PASSWORD FORM ================= -->
        <form id="forgot-form" class="auth-form auth-hidden">
            <p class="auth-description">Enter your registered email to receive an account recovery link.</p>

            <div class="form-group">
                <label for="forgot-email">Email Address</label>
                <input type="email" id="forgot-email" class="form-control" placeholder="Enter your registered email" required>
            </div>

            <button type="submit" class="btn btn-primary auth-btn">
                <i class="fa-solid fa-paper-plane btn-icon-left"></i> Send Recovery Link
            </button>

            <div class="auth-toggle">
                <span>Remembered your password?</span>
                <a onclick="switchAuthView('login')">Back to Sign In</a>
            </div>
        </form>

    </div>
</div>

<div id="toast-container"></div>
<script src="js/api-client.js"></script>
<script src="js/auth.js"></script>
</body>
</html>
