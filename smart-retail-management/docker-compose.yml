services:
  # ==========================================
  # MySQL Database Service
  # ==========================================
  mysql-db:
    image: mysql:8.0
    container_name: zetlan-mysql
    restart: always
    environment:
      MYSQL_DATABASE: zetlan_db
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_USER: zetlan_user
      MYSQL_PASSWORD: zetlanpassword
    ports:
      - "3307:3306"
    volumes:
      - db-data:/var/lib/mysql
    networks:
      - zetlan-network
    healthcheck:
      test: ["CMD", "mysqladmin" ,"ping", "-h", "localhost", "-u", "root", "-prootpassword"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ==========================================
  # ZetLan Full-Stack Application Service
  # ==========================================
  zetlan-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: zetlan-backend
    restart: always
    depends_on:
      mysql-db:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql-db:3306/zetlan_db?useSSL=false&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: zetlan_user
      SPRING_DATASOURCE_PASSWORD: zetlan$1234
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
    networks:
      - zetlan-network

networks:
  zetlan-network:
    driver: bridge

volumes:
  db-data: